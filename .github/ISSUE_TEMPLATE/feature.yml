name: Feature
description: Something new, or a change to how something works.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: why
    attributes: { label: Why, description: "Who needs it and what problem it solves." }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What, description: "The behaviour, in plain words. Use GLOSSARY.md terms." }
    validations: { required: true }
  - type: textarea
    id: refs
    attributes: { label: Code refs, description: "file:line for the code it touches or reuses.", placeholder: "src/foo.ts:42 - ..." }
    validations: { required: true }
  - type: textarea
    id: done
    attributes: { label: Done when, description: "Checkable conditions. Each one a test or something you can see.", placeholder: "- [ ] ..." }
    validations: { required: true }
