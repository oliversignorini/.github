name: Bug
description: Something is broken.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes: { label: What happens, description: "What you did, what you saw, what you expected." }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, placeholder: "1. ...\n2. ..." }
    validations: { required: true }
  - type: textarea
    id: where
    attributes: { label: Where in the code, description: "file:line refs if you know them." }
  - type: textarea
    id: done
    attributes: { label: Done when, description: "The observable result that closes this issue." }
    validations: { required: true }
